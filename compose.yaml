# Default: infrastructure only — run services on the host with `pnpm dev`.
# `docker compose --profile app up` adds every service in a container.

name: tally

x-node-service: &node-service
  profiles: [app]
  restart: unless-stopped
  environment: &service-env
    LOG_LEVEL: ${LOG_LEVEL:-info}
    KAFKA_BROKERS: redpanda:9092
    DATABASE_URL: postgres://${POSTGRES_USER:-tally}:${POSTGRES_PASSWORD:-tally}@postgres:5432/${POSTGRES_DB:-tally}
    REDIS_URL: redis://redis:6379
  depends_on:
    redpanda: { condition: service_healthy }
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  redpanda:
    image: redpandadata/redpanda:v26.2.3
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --default-log-level=warn
      # Two listeners: containers dial redpanda:9092, host-run services dial localhost:19092.
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -Eq 'Healthy:.+true'"]
      interval: 3s
      timeout: 5s
      retries: 20

  # One-shot, idempotent: creates the topics (default profile, so host-run services get them too)
  # with TOPIC_PARTITIONS partitions, and raises existing ones to it (F35). The count caps how many
  # consumers can share a group. Partitions can be added, never removed. Votes are keyed by
  # idempotency key, so nothing depends on which partition a vote lands on.
  topics:
    image: redpandadata/redpanda:v26.2.3
    environment:
      TOPIC_PARTITIONS: ${TOPIC_PARTITIONS:-24}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        n="$$TOPIC_PARTITIONS"
        case "$$n" in ''|*[!0-9]*|0) echo "TOPIC_PARTITIONS must be a positive integer, got '$$n'" >&2; exit 1 ;; esac
        b="-X brokers=redpanda:9092"
        rpk topic create votes.raw votes.dead --if-not-exists -p "$$n" -r 1 $$b
        for t in votes.raw votes.dead; do
          have=$$(rpk topic list $$b | awk -v t="$$t" '$$1 == t { print $$2 }')
          case "$$have" in ''|*[!0-9]*) echo "couldn't read $$t's partition count from rpk (got '$$have')" >&2; exit 1 ;; esac
          if [ "$$have" -lt "$$n" ]; then
            rpk topic add-partitions "$$t" -n $$((n - have)) $$b
          elif [ "$$have" -gt "$$n" ]; then
            echo "warning: $$t has $$have partitions, more than TOPIC_PARTITIONS=$$n; partitions can't be removed" >&2
          fi
        done
        rpk topic list $$b
    depends_on:
      redpanda: { condition: service_healthy }

  postgres:
    image: postgres:18.6-alpine
    # F23: the votes table's unique index outgrew the 128 MB default (316 MB at 4M votes).
    command: ["postgres", "-c", "shared_buffers=512MB"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tally}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tally}
      POSTGRES_DB: ${POSTGRES_DB:-tally}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

  # Analytics store (F20). Default profile, like the other infrastructure.
  clickhouse:
    image: clickhouse/clickhouse-server:26.9
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-tally}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-tally}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-tally}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    ports: ["8123:8123"]
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infra/clickhouse/low-overhead.xml:/etc/clickhouse-server/config.d/low-overhead.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 3s
      timeout: 5s
      retries: 20

  # One-shot: migrate, then seed (idempotent). Consumer and web wait for it to exit 0.
  migrate:
    profiles: [app]
    build: { context: ., dockerfile: packages/db/Dockerfile }
    command: ["sh", "-c", "node dist/migrate.js && node dist/seed.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tally}:${POSTGRES_PASSWORD:-tally}@postgres:5432/${POSTGRES_DB:-tally}
    depends_on:
      postgres: { condition: service_healthy }

  ingest:
    <<: *node-service
    environment:
      <<: *service-env
      # Empty if unset in .env; ingest then refuses to start with a clear error.
      VOTER_HASH_SALT: ${VOTER_HASH_SALT:-}
    depends_on:
      redpanda: { condition: service_healthy }
      topics: { condition: service_completed_successfully }
    build: { context: ., dockerfile: services/ingest/Dockerfile }
    # F36: several replicas behind ingest-proxy, which owns port 4000. No host port here, so they
    # can scale: INGEST_REPLICAS=3 docker compose --profile app up -d (or --scale ingest=3).
    deploy:
      replicas: ${INGEST_REPLICAS:-1}

  # F36: the one entry point for votes. Spreads requests over the ingest replicas, as the host's
  # load balancer would in production.
  ingest-proxy:
    profiles: [app]
    image: nginx:1.30.5-alpine
    restart: unless-stopped
    volumes:
      - ./infra/nginx/ingest.conf:/etc/nginx/nginx.conf:ro
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    depends_on:
      ingest: { condition: service_started }
    ports: ["4000:4000"]

  gateway:
    <<: *node-service
    build: { context: ., dockerfile: services/gateway/Dockerfile }
    ports: ["4001:4001"]

  consumer:
    <<: *node-service
    depends_on:
      redpanda: { condition: service_healthy }
      # Re-created topics (TOPIC_PARTITIONS raised) restart the consumers, so they're assigned the
      # new partitions: without a rejoin, votes keyed onto them would sit uncounted.
      topics: { condition: service_completed_successfully, restart: true }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    build: { context: ., dockerfile: services/consumer/Dockerfile }
    # F37: several replicas share the tally-consumer group, each taking a share of the partitions.
    # No host port, so they can scale: CONSUMER_REPLICAS=3 docker compose --profile app up -d.
    deploy:
      replicas: ${CONSUMER_REPLICAS:-1}

  # Second consumer group (F20): votes.raw + votes.dead → ClickHouse. Live results never wait for it.
  analytics-consumer:
    <<: *node-service
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      KAFKA_BROKERS: redpanda:9092
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-tally}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-tally}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-tally}
    depends_on:
      redpanda: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      # Re-created topics (TOPIC_PARTITIONS raised) restart the consumers, so they're assigned the
      # new partitions: without a rejoin, votes keyed onto them would sit uncounted.
      topics: { condition: service_completed_successfully, restart: true }
    build: { context: ., dockerfile: services/analytics-consumer/Dockerfile }
    ports: ["4004:4004"]

  # Metrics (F23): Prometheus scrapes every service's /metrics and Redpanda every 5 s.
  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: [app]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]

  # Dashboards (F23), provisioned from infra/grafana. Anonymous viewers see the Tally dashboard;
  # editing needs GRAFANA_ADMIN_PASSWORD.
  grafana:
    image: grafana/grafana:13.2.2
    profiles: [app]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tally.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    ports: ["3001:3000"]

  # F18, one-shot: docker compose run --rm reconcile [--repair] [--contest <uuid>] [--json]
  # Its own profile, so `up` never runs it. Same image as the consumer.
  reconcile:
    <<: *node-service
    profiles: [tools]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    build: { context: ., dockerfile: services/consumer/Dockerfile }
    entrypoint: ["node", "dist/reconcile.js"]
    command: []
    ports: []

  web:
    <<: *node-service
    environment:
      <<: *service-env
      # As the browser sees it, not as containers do: the page connects from the viewer's machine.
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-ws://localhost:4001}
      GENERATOR_URL: http://generator:4002
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-tally}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-tally}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-tally}
      # Empty if unset in .env; sign-in is then disabled rather than open.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      redpanda: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ["3000:3000"]

  generator:
    profiles: [app]
    restart: unless-stopped
    build: { context: tools/generator }
    ports: ["4002:4002"]
    environment:
      INGEST_URL: http://ingest-proxy:4000
    depends_on:
      ingest-proxy: { condition: service_started }

volumes:
  clickhouse-data:
  grafana-data:
  prometheus-data:
  redpanda-data:
  postgres-data:
  redis-data:
