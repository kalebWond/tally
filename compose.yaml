# Default: infrastructure only — run services on the host with `pnpm dev`.
# `docker compose --profile app up` adds every service in a container.

name: tally

x-node-service: &node-service
  profiles: [app]
  restart: unless-stopped
  environment: &service-env
    LOG_LEVEL: ${LOG_LEVEL:-info}
    KAFKA_BROKERS: redpanda:9092
    DATABASE_URL: postgres://${POSTGRES_USER:-tally}:${POSTGRES_PASSWORD:-tally}@postgres:5432/${POSTGRES_DB:-tally}
    REDIS_URL: redis://redis:6379
  depends_on:
    redpanda: { condition: service_healthy }
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  redpanda:
    image: redpandadata/redpanda:v26.2.3
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --default-log-level=warn
      # Two listeners: containers dial redpanda:9092, host-run services dial localhost:19092.
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -Eq 'Healthy:.+true'"]
      interval: 3s
      timeout: 5s
      retries: 20

  # One-shot, idempotent: creates the topics (default profile, so host-run services get them too).
  # 6 partitions caps the consumer group at 6 parallel instances; raising it later remaps keys.
  topics:
    image: redpandadata/redpanda:v26.2.3
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        rpk topic create votes.raw votes.dead --if-not-exists -p 6 -r 1 -X brokers=redpanda:9092
        && rpk topic describe votes.raw -p -X brokers=redpanda:9092
    depends_on:
      redpanda: { condition: service_healthy }

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tally}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tally}
      POSTGRES_DB: ${POSTGRES_DB:-tally}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

  # One-shot: migrate, then seed (idempotent). Consumer and web wait for it to exit 0.
  migrate:
    profiles: [app]
    build: { context: ., dockerfile: packages/db/Dockerfile }
    command: ["sh", "-c", "node dist/migrate.js && node dist/seed.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tally}:${POSTGRES_PASSWORD:-tally}@postgres:5432/${POSTGRES_DB:-tally}
    depends_on:
      postgres: { condition: service_healthy }

  ingest:
    <<: *node-service
    environment:
      <<: *service-env
      # Empty if unset in .env; ingest then refuses to start with a clear error.
      VOTER_HASH_SALT: ${VOTER_HASH_SALT:-}
    depends_on:
      redpanda: { condition: service_healthy }
      topics: { condition: service_completed_successfully }
    build: { context: ., dockerfile: services/ingest/Dockerfile }
    ports: ["4000:4000"]

  gateway:
    <<: *node-service
    build: { context: ., dockerfile: services/gateway/Dockerfile }
    ports: ["4001:4001"]

  consumer:
    <<: *node-service
    depends_on:
      redpanda: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    build: { context: ., dockerfile: services/consumer/Dockerfile }
    ports: ["4003:4003"]

  # F18, one-shot: docker compose run --rm reconcile [--repair] [--contest <uuid>] [--json]
  # Its own profile, so `up` never runs it. Same image as the consumer.
  reconcile:
    <<: *node-service
    profiles: [tools]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    build: { context: ., dockerfile: services/consumer/Dockerfile }
    entrypoint: ["node", "dist/reconcile.js"]
    command: []
    ports: []

  web:
    <<: *node-service
    environment:
      <<: *service-env
      # As the browser sees it, not as containers do: the page connects from the viewer's machine.
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-ws://localhost:4001}
      GENERATOR_URL: http://generator:4002
      # Empty if unset in .env; sign-in is then disabled rather than open.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      redpanda: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ["3000:3000"]

  generator:
    profiles: [app]
    restart: unless-stopped
    build: { context: tools/generator }
    ports: ["4002:4002"]
    environment:
      INGEST_URL: http://ingest:4000
    depends_on:
      ingest: { condition: service_started }

volumes:
  redpanda-data:
  postgres-data:
  redis-data:
