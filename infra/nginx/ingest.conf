# F36: spreads POST /votes over every ingest replica. Stands in for the host's load balancer.
# `resolve` re-reads the replicas from Docker's DNS, so `INGEST_REPLICAS` or `--scale ingest=N`
# takes effect without a reload. Connections to the replicas stay open (keepalive).
worker_processes 2;
# Each request holds two descriptors (client and replica). The container's default limit ran out at
# 1,024 generator connections (F38: accept4() failed, "No file descriptors available").
worker_rlimit_nofile 65536;

events {
  worker_connections 16384;
}

http {
  access_log off;
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream ingest {
    zone ingest 64k;
    server ingest:4000 resolve;
    # Enough idle connections for the requests in flight, so a busy replica isn't also asked to
    # accept new connections for each one.
    keepalive 1024;
  }

  server {
    listen 4000;

    location / {
      proxy_pass http://ingest;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # A replica that is gone (scaled down, restarting) is skipped rather than failing the vote.
      # POST isn't retried by default: ingest may already have published it. The Idempotency-Key
      # makes a client's own retry safe.
      proxy_next_upstream error timeout;
      # A saturated replica accepts new connections slowly. Wait for it (longer than the generator's
      # 8 s request limit) rather than failing the vote: overload should show as latency, as it does
      # without the proxy. At 2 s, a thousand concurrent requests turned into connect timeouts (F38).
      proxy_connect_timeout 10s;
    }
  }
}
